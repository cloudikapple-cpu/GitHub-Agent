name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          ruff check jarvis tests 2>&1 | tee ruff.log

      - name: Report the lint failure on the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Lint failure"
            echo
            echo '```'
            tail -n 60 ruff.log || echo "no log captured"
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md || true

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      # The log is kept so a failure can be read without opening the web UI:
      # it is attached as an artifact and, on a pull request, posted as a
      # comment. Chasing a red run through six jobs is otherwise a chore.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rf --cov=jarvis --cov-report=term-missing 2>&1 | tee pytest.log

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest.log
          if-no-files-found: ignore

      - name: Report the failure on the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Test failure: ${{ matrix.os }} / Python ${{ matrix.python-version }}"
            echo
            echo '```'
            tail -n 60 pytest.log || echo "no log captured"
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md || true
