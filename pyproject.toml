[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-desktop"
version = "0.4.1"
description = "An extensible desktop AI assistant with tools, skills, MCP, memory, reminders, voice and a global hotkey"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
web = ["beautifulsoup4>=4.12", "duckduckgo-search>=6.0"]
desktop = ["pyautogui>=0.9.54", "pyperclip>=1.8", "psutil>=5.9", "Pillow>=10.0"]
hotkey = ["pynput>=1.7"]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4", "pyttsx3>=2.90"]
notify = ["plyer>=2.1"]
tray = ["pystray>=0.19", "Pillow>=10.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
# Everything a Windows 11 desktop install needs in one extra.
windows = [
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
    "psutil>=5.9",
    "Pillow>=10.0",
    "pynput>=1.7",
    "pystray>=0.19",
    "plyer>=2.1",
]
all = [
    "openai>=1.30",
    "anthropic>=0.30",
    "beautifulsoup4>=4.12",
    "duckduckgo-search>=6.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
    "psutil>=5.9",
    "Pillow>=10.0",
    "pynput>=1.7",
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "pyttsx3>=2.90",
    "plyer>=2.1",
    "pystray>=0.19",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is handled by the formatter.
# B008: function calls in default arguments are intentional for tool factories.
# UP035: most modules still import Callable from typing; the migration to
#        collections.abc is happening module by module (ui.py is done).
ignore = ["E501", "B008", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
