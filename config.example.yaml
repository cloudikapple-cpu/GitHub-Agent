# Jarvis configuration example. Copy to config.yaml and edit.
# ${VAR} is replaced with the environment variable of that name, so secrets
# can stay in .env while this file goes into version control.
# keyring:NAME reads the secret from the OS keychain instead:
#   jarvis --set-secret NVIDIA_API_KEY

# Which provider to use when the router is off.
backend: openai

providers:
  openai:
    kind: openai
    model: gpt-4o-mini
    api_key: ${OPENAI_API_KEY}

  # Any OpenAI-compatible endpoint works the same way.
  openrouter:
    kind: openai
    model: deepseek/deepseek-chat
    api_key: ${OPENROUTER_API_KEY}
    base_url: https://openrouter.ai/api/v1
    headers:
      HTTP-Referer: https://localhost

  # NVIDIA NIM — cloud rescue for the local model.
  nim:
    kind: openai
    model: meta/llama-3.3-70b-instruct
    # The key can live in the OS keychain instead of a file:
    #   api_key: keyring:NVIDIA_API_KEY
    api_key: ${NVIDIA_API_KEY}
    base_url: https://integrate.api.nvidia.com/v1

  # Groq — very fast hosted inference, OpenAI-compatible.
  groq:
    kind: openai
    model: llama-3.3-70b-versatile
    api_key: ${GROQ_API_KEY}
    base_url: https://api.groq.com/openai/v1

  # Local model: free, private, offline.
  #   ollama serve && ollama pull llama3.1
  ollama:
    kind: ollama
    model: llama3.1
    base_url: http://localhost:11434
    timeout: 300
    temperature: 0.7
    max_tokens: 2048
    # Anything else here is passed to Ollama as an option.
    extra_body:
      num_ctx: 8192
      keep_alive: 10m

  # A vision-capable local model, used by the screen tools.
  ollama-vision:
    kind: ollama
    model: llama3.2-vision
    base_url: http://localhost:11434
    vision: true

  # Local OpenAI-compatible server (LM Studio, vLLM, llama.cpp).
  local:
    kind: openai
    model: qwen2.5-7b-instruct
    base_url: http://localhost:1234/v1

# Local model first, NVIDIA NIM when it fails or the task is heavy.
router:
  enabled: false
  primary: ollama
  fallbacks: [nim]
  heavy: nim
  escalate_over_chars: 4000

behaviour:
  require_confirmation: true
  max_iterations: 12
  dry_run: false
  persona: ""

security:
  allow_shell: true
  allow_exec: true
  allow_desktop: true
  allow_app_management: false
  allow_network: true
  # Empty means the whole filesystem minus the deny-list below.
  allowed_roots: []
  audit_log: ~/.jarvis/audit.log

# Run shell commands and generated code inside a container instead of the host.
execution_sandbox:
  mode: none          # none | docker | firejail
  image: python:3.12-slim
  network: false
  workdir: ~/.jarvis/sandbox
  timeout: 120
  memory_limit: 1g

# Internet access. Tavily is used when a key is set, DuckDuckGo otherwise.
search:
  provider: auto      # auto | tavily | duckduckgo
  tavily_api_key: ${TAVILY_API_KEY}
  max_results: 5
  depth: basic        # basic | advanced
  include_answer: true

# Durable notes recalled by meaning across sessions.
knowledge:
  enabled: true
  path: ~/.jarvis/knowledge.db
  # Leave empty for the offline hashing embedder.
  embedding_provider: ""
  embedding_model: text-embedding-3-small
  top_k: 5

# Repeated questions are answered from disk instead of the model.
# Replies that call a tool are never cached.
cache:
  enabled: true
  path: ~/.jarvis/cache.db
  ttl_seconds: 86400
  max_entries: 5000

# Retrieval over your own files: jarvis --index "~/Documents"
rag:
  enabled: false
  path: ~/.jarvis/documents.db
  roots:
    - ~/Documents
  top_k: 4
  chunk_size: 1200
  overlap: 150
  min_score: 0.12

# A cheap model drafts the steps, the main model carries them out.
planner:
  enabled: false
  provider: ""        # empty means the active provider
  max_steps: 6
  min_chars: 280

# Chat with Jarvis in the browser: jarvis --web
# Every request needs the generated token, so keep the host on loopback.
web:
  enabled: false
  host: 127.0.0.1
  port: 8765
  token: ""          # empty means a fresh token at every start
  open_browser: true

# Reminders and unattended tasks (the daemon runs them).
scheduler:
  enabled: true
  path: ~/.jarvis/jobs.json
  tick_seconds: 20

# Let the assistant look at the screen (needs a vision-capable model).
vision:
  enabled: false
  provider: openai
  max_width: 1280

voice:
  enabled: false
  # auto  - Groq when GROQ_API_KEY is set, local whisper otherwise
  # groq  - hosted Whisper: fastest, best Russian, needs GROQ_API_KEY
  # whisper | google | vosk
  stt: auto
  # Local size (tiny/base/small/...) or a Groq model name.
  whisper_model: base
  language: ru
  tts: pyttsx3        # pyttsx3 | none
  speak_replies: true
  record_seconds: 8

interface:
  # Alt+Shift avoids the Ctrl+Alt combinations Windows and input methods take.
  hotkey: alt+shift+space
  voice_hotkey: alt+shift+v
  overlay: true
  notify: true
  tray: true
  stream: true

memory:
  persist: true
  path: ~/.jarvis/history.json
  max_messages: 60
  max_chars: 24000

# Control Jarvis from your phone. Never leave allowed_user_ids empty.
telegram:
  enabled: false
  token: ${TELEGRAM_BOT_TOKEN}
  allowed_user_ids: []
  allow_confirmations: false

# Any MCP server becomes a set of tools.
mcp_servers:
  github:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
    enabled: false
  remote:
    url: https://example.com/mcp
    headers:
      Authorization: Bearer ${REMOTE_MCP_TOKEN}
    enabled: false

skills_dirs:
  - ~/.jarvis/skills
  - ./skills

# Named REST services: the model calls them by name and never sees the token.
integrations:
  notion:
    base_url: https://api.notion.com/v1
    headers:
      Authorization: Bearer ${NOTION_TOKEN}
      Notion-Version: "2022-06-28"
